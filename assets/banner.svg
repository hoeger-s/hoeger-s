<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Stefan Höger, Fachinformatiker für Systemintegration, Infrastruktur und IT-Security">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03050a"/>
      <stop offset="0.55" stop-color="#060b18"/>
      <stop offset="1" stop-color="#0a1430"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="1" r="0.6">
      <stop offset="0" stop-color="#1d4ed8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="led" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#60a5fa" stop-opacity="1"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="gridFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridMask">
      <rect width="1280" height="320" fill="url(#gridFade)"/>
    </mask>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#3b82f6" stroke-opacity="0.14" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Hintergrund -->
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)" mask="url(#gridMask)"/>
  <ellipse cx="1000" cy="170" rx="300" ry="170" fill="url(#glowRight)"/>
  <rect x="0" y="120" width="1280" height="200" fill="url(#glow)"/>

  <!-- LED-Leiste unten -->
  <rect x="80" y="314" width="1120" height="6" fill="url(#led)" filter="url(#blur)" opacity="0.9"/>
  <rect x="80" y="317" width="1120" height="1.5" fill="url(#led)"/>

  <!-- Text links -->
  <rect x="64" y="66" width="3" height="176" rx="1.5" fill="url(#accent)"/>
  <text x="91" y="84" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#64748b" letter-spacing="3">WELCOME TO MY GITHUB</text>
  <text x="88" y="142" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="700" fill="#f1f5f9" letter-spacing="0.5">Stefan Höger</text>
  <text x="90" y="186" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="500" fill="#93c5fd">Fachinformatiker für Systemintegration</text>
  <text x="90" y="234" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="16" xml:space="preserve"><tspan fill="#3b82f6">root@localhost</tspan><tspan fill="#64748b">:~# </tspan><tspan fill="#cbd5e1">infrastruktur · it-security · self-hosting </tspan><tspan fill="#60a5fa">▌<animate attributeName="fill-opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>

</svg>
